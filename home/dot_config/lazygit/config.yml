gui:
  nerdFontsVersion: "3"
  showFileTree: true
  showRandomTip: false
  filterMode: fuzzy
  showDivergenceFromBaseBranch: onlyArrow

git:
  parseEmoji: true
  autoFetch: true

os:
  editPreset: "nvim"

promptToReturnFromSubprocess: false

customCommands:
  - key: "<c-g>"
    context: "files"
    description: "Commit changes with gitmoji"
    loadingText: "Creating Gitmoji commit..."
    prompts:
      - type: "menuFromCommand"
        key: "gitmoji"
        title: "Choose a Gitmoji"
        command: "gitmoji -l"
        filter: "^(?P<emoji>.*?) - (?P<code>:.*?:) - (?P<description>.*)$"
        valueFormat: "{{ .emoji }}"
        labelFormat: "{{ .emoji }} {{ .description }}"
      - type: "input"
        key: "message"
        title: "Enter a capitalized commit title"
    command: 'git commit -m {{ printf "%s %s" .Form.gitmoji .Form.message | quote }}'
