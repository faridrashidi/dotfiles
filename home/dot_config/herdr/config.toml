# herdr plugin install thanhdat77/herdr-navigator
# herdr plugin install smarzban/herdr-file-viewer

[update]
version_check = false

[keys]
prefix = "ctrl+a"

[theme]
name = "gruvbox"

[ui.toast]
delivery = "herdr"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"
