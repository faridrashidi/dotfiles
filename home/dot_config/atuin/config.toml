style = "compact"
search_mode = "fuzzy"
workspaces = true
filter_mode = "workspace"
filter_mode_shell_up_key_binding = "session"
inline_height = 10
show_preview = false
show_help = false
show_tabs = false
store_failed = true
enter_accept = true
secrets_filter = true
history_filter = [
  "^ls( .*)?$",
  "^cd( .*)?$",
  "^clear$",
  "^exit$",
  "^pwd$",
  "^history$",
  "^c$",
  "^z( .*)?$",
  "^zi( .*)?$",
]
