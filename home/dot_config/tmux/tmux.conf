# ==========================
# General Settings
# ==========================

# Set prefix to Ctrl+a
set -g prefix C-a

# Terminal settings
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
set-option -sa terminal-overrides ",xterm*:Tc"

# Let programs write escape sequences straight through to the terminal.
# Required for image previews (superfile, nvim) to render inside tmux.
set -g allow-passthrough on

# Enable mouse support
set -g mouse on

# Copy to the system clipboard via OSC 52 — also works over SSH to Biowulf
set -g set-clipboard on

# vi keys in copy mode — set explicitly rather than inferred from $EDITOR
setw -g mode-keys vi

# Switch to the next session instead of exiting when one is destroyed.
# Keeps the sesh picker usable after killing a session.
set -g detach-on-destroy off

# Position status bar at the top
set -g status-position top

# Neovim's autoread and some plugins require focus-event
set-option -g focus-events on

# Start window and pane numbering at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Notify if other windows have activity
setw -g monitor-activity on

# Renumber windows automatically when closed
set -g renumber-windows on

# Increase scrollback buffer (default 2000 is too small)
set -g history-limit 50000

# Always open two panes side by side
set-hook -g after-new-window 'split-window -h'
set-hook -g after-new-session 'split-window -h'

# ==========================
# Keybindings
# ==========================

# Split panes using | and -
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload configuration
bind r source-file $HOME/.config/tmux/tmux.conf \; display "Reloaded!"

# Session picker
bind o display-popup -E -h 90% -w 50% -d "#{pane_current_path}" -T "Sesh" "sesh picker -i"

# ==========================
# Plugins
# ==========================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-floax'

# ==========================
# Plugin Configuration
# ==========================

# --- Resurrect & Continuum ---
set -g @continuum-restore 'off'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# --- Floax ---
set -g @floax-bind 'p'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'

# ==========================
# TPM Initialization
# ==========================

setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.cache/tmux/plugins/"

# Auto-install TPM if not present
if-shell "test ! -d $HOME/.cache/tmux/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm $HOME/.cache/tmux/tpm && $HOME/.cache/tmux/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager
run '$HOME/.cache/tmux/tpm/tpm'

# ==========================
# Gruvbox Material Dark Theme
# ==========================

set -g status-style "fg=#d4be98,bg=default"
set -g status-left-length 100
set -g status-left "#[fg=#7daea3,bg=default]#[fg=#282828,bg=#7daea3,bold] #S #[fg=#7daea3,bg=default]"
set -g status-right-length 100
set -g status-right ""

set -g window-status-separator ""
set -g window-status-current-format "#[fg=#a9b665,bg=default]#[fg=#282828,bg=#a9b665]●#[fg=#a9b665,bg=default]"
set -g window-status-format "#[fg=#504945,bg=default]#[fg=#d4be98,bg=#504945]#I#[fg=#504945,bg=default]"

set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#a9b665"
set -g message-style "fg=#282828,bg=#d8a657,bold"
set -g mode-style "fg=#282828,bg=#d8a657,bold"
set -g popup-border-style "fg=#d3869b"
